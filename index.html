<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebAR with Three.js and VR</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: linear-gradient(135deg, #fffafa, #fad0c4);
      touch-action: none;
    }
    canvas {
      display: block;
    }
    #enterVRButton {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 10px 20px;
      background-color: #f7f7f7;
      color: rgb(0, 0, 0);
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      z-index: 100;
    }
    #permissionButton {
      position: fixed;
      top: 20px;
      left: 20px;
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      z-index: 100;
    }
    #message {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(0,0,0,0.7);
      color: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      max-width: 80%;
      z-index: 100;
      display: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/VRControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/effects/VREffect.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/webvr-polyfill@0.10.12/build/webvr-polyfill.min.js"></script>
</head>
<body>
  <button id="permissionButton">Enable Motion Sensors</button>
  <button id="enterVRButton">Enter VR</button>
  <div id="message"></div>

  <script>
    // Check for secure context
    if (!window.isSecureContext) {
      showMessage("This application requires a secure context (HTTPS). Please load this page over HTTPS.");
    }

    // Initialize WebVR polyfill
    if (typeof WebVRPolyfill !== 'undefined') {
      new WebVRPolyfill();
    }

    // Show message function
    function showMessage(text) {
      const messageEl = document.getElementById('message');
      messageEl.textContent = text;
      messageEl.style.display = 'block';
    }

    // Hide message function
    function hideMessage() {
      document.getElementById('message').style.display = 'none';
    }

    // Request device orientation permission
    document.getElementById('permissionButton').addEventListener('click', async () => {
      try {
        if (typeof DeviceOrientationEvent !== 'undefined' && 
            typeof DeviceOrientationEvent.requestPermission === 'function') {
          const permission = await DeviceOrientationEvent.requestPermission();
          if (permission === 'granted') {
            hideMessage();
            initScene();
          } else {
            showMessage("Permission denied. Some features may not work.");
          }
        } else {
          // Permission API not required, proceed
          initScene();
        }
      } catch (error) {
        showMessage("Error requesting permission: " + error.message);
      }
    });

    // Scene initialization
    function initScene() {
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      // Set up lights
      const lightAbove = new THREE.DirectionalLight(0xffffff, 5);
      lightAbove.position.set(0, 1, 0).normalize();
      scene.add(lightAbove);

      const lightBelow = new THREE.PointLight(0xffffff, 5);
      lightBelow.position.set(0, -1, 0).normalize();
      scene.add(lightBelow);

      const lightRight = new THREE.PointLight(0xffffff, 5);
      lightRight.position.set(1, 0, 0).normalize();
      scene.add(lightRight);

      const lightLeft = new THREE.PointLight(0xffffff, 5);
      lightLeft.position.set(-1, 0, 0).normalize();
      scene.add(lightLeft);

      let model, model2;
      const loader = new THREE.GLTFLoader();

      // Load the first model
      loader.load('heartarvr.glb', 
        function (gltf) {
          model = gltf.scene;
          setModelProperties(model, 0, -0.5, 0);
          scene.add(model);
        },
        undefined,
        function (error) {
          console.error('Error loading model:', error);
          showMessage("Error loading 3D model. Please try again later.");
        }
      );

      function setModelProperties(model, posX, posY, posZ) {
        const scaleValue = isMobile() ? 0.3 : 0.5;
        model.scale.set(scaleValue, scaleValue, scaleValue);
        model.position.set(posX, posY, posZ);
      }

      function isMobile() {
        return window.innerWidth <= 768;
      }

      camera.position.set(0, 0, 3);

      let isDragging = false;
      let previousX = 0;
      let previousY = 0;

      function onPointerDown(event) {
        // Only allow interaction after permission is granted
        if (document.getElementById('permissionButton').style.display !== 'none') {
          return;
        }
        isDragging = true;
        previousX = event.clientX || event.touches[0].clientX;
        previousY = event.clientY || event.touches[0].clientY;
      }

      function onPointerMove(event) {
        if (!isDragging || !model) return;

        const currentX = event.clientX || event.touches[0].clientX;
        const currentY = event.clientY || event.touches[0].clientY;

        const deltaX = (currentX - previousX) * 0.01;
        const deltaY = (currentY - previousY) * 0.01;

        model.rotation.y += deltaX;
        model.rotation.x += deltaY;

        if (model2) {
          model2.rotation.y -= deltaX;
          model2.rotation.x -= deltaY;
        }

        previousX = currentX;
        previousY = currentY;
      }

      function onPointerUp() {
        isDragging = false;
      }

      document.addEventListener('mousedown', onPointerDown);
      document.addEventListener('mousemove', onPointerMove);
      document.addEventListener('mouseup', onPointerUp);
      document.addEventListener('touchstart', onPointerDown);
      document.addEventListener('touchmove', onPointerMove);
      document.addEventListener('touchend', onPointerUp);

      function handleGamepadInput() {
        const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
        const gp = gamepads[0];

        if (gp && model) {
          const deltaX = gp.axes[0] * 0.05;
          const deltaY = gp.axes[1] * 0.05;

          model.rotation.y += deltaX;
          model.rotation.x += deltaY;

          if (model2) {
            model2.rotation.y -= deltaX;
            model2.rotation.x -= deltaY;
          }
        }
      }

      // Set up VR if available
      let vrEffect, vrControls;
      if ('xr' in navigator) {
        navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
          if (supported) {
            // Initialize VR effect and controls
            vrEffect = new THREE.VREffect(renderer);
            vrControls = new THREE.VRControls(camera);
            
            // Update VR button text
            document.getElementById('enterVRButton').textContent = 'Enter VR';
          } else {
            document.getElementById('enterVRButton').style.display = 'none';
          }
        }).catch((error) => {
          console.error('VR support check failed:', error);
          document.getElementById('enterVRButton').style.display = 'none';
        });
      } else {
        document.getElementById('enterVRButton').style.display = 'none';
      }

      function animate() {
        requestAnimationFrame(animate);
        
        handleGamepadInput();
        
        if (vrControls) {
          vrControls.update();
        }
        
        if (vrEffect && vrEffect.isPresenting) {
          vrEffect.render(scene, camera);
        } else {
          renderer.render(scene, camera);
        }
      }

      animate();

      // Handle VR button click
      document.getElementById('enterVRButton').addEventListener('click', async () => {
        if (!navigator.xr) {
          showMessage("WebXR not supported in your browser");
          return;
        }

        try {
          if (!model2) {
            loader.load('brainspinal.glb', 
              function (gltf) {
                model2 = gltf.scene;

                if (isMobile()) {
                  setModelProperties(model, 0, 1.4, -1);
                  setModelProperties(model2, 0, -1.4, -1);
                } else {
                  setModelProperties(model, -3, -0.5, 0);
                  setModelProperties(model2, 3, -0.5, 0);
                }

                scene.add(model2);

                if (isMobile()) {
                  model.rotation.z = Math.PI / 2;
                  model2.rotation.z = Math.PI / 2;
                }
              },
              undefined,
              function (error) {
                console.error('Error loading second model:', error);
                showMessage("Error loading second 3D model.");
              }
            );
          }

          // Request VR session
          const session = await navigator.xr.requestSession('immersive-vr');
          session.addEventListener('end', () => {
            vrEffect.setSession(null);
            document.getElementById('enterVRButton').textContent = 'Enter VR';
          });
          
          vrEffect.setSession(session);
          document.getElementById('enterVRButton').textContent = 'Exit VR';
          
        } catch (error) {
          console.error('VR session error:', error);
          showMessage("Failed to start VR session: " + error.message);
        }
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        if (vrEffect) {
          vrEffect.setSize(window.innerWidth, window.innerHeight);
        }
      });

      // Hide permission button if not needed
      if (typeof DeviceOrientationEvent === 'undefined' || 
          typeof DeviceOrientationEvent.requestPermission !== 'function') {
        document.getElementById('permissionButton').style.display = 'none';
      }
    }

    // Auto-init if permission API not required
    if (typeof DeviceOrientationEvent === 'undefined' || 
        typeof DeviceOrientationEvent.requestPermission !== 'function') {
      initScene();
    }
  </script>
</body>
</html>
